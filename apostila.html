<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apostila: Informática Aplicada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header class="topo"><a href="index.html">Voltar à trilha</a></header>
  <main>
    <h1>Apostila: Informática Aplicada</h1>
    <div class="nao-imprimir">
      <p class="intro">A apostila reúne o texto de todas as unidades disponíveis. Para PDF, clique em Baixar PDF e escolha "Salvar como PDF" na janela de impressão.</p>
      <p><button class="botao" id="pdf">Baixar PDF</button> <button class="botao" id="word">Baixar em Word</button></p>
      <p id="erro" role="alert"></p>
    </div>
    <div id="doc"></div>
  </main>
  <script src="js/app.js"></script>
  <script>
    const alvo = document.getElementById("doc");
    const prontos = MODULOS.filter((m) => m.arquivo);
    Promise.all(prontos.map((m) => fetch("modulos/" + m.arquivo).then((r) => r.text()))).then((htmls) => {
      htmls.forEach((t) => {
        const c = new DOMParser().parseFromString(t, "text/html").querySelector(".conteudo");
        if (!c) return;
        c.querySelectorAll(".so-tela").forEach((e) => e.remove());
        c.querySelectorAll("h2").forEach((h) => { const h3 = document.createElement("h3"); h3.innerHTML = h.innerHTML; h.replaceWith(h3); });
        const s = document.createElement("section");
        const m = prontos[htmls.indexOf(t)];
        s.innerHTML = `<h2>Unidade ${MODULOS.indexOf(m) + 1}: ${m.titulo}</h2>` + c.innerHTML;
        alvo.appendChild(s);
      });
    }).catch(() => { document.getElementById("erro").textContent = "Não foi possível carregar. Abra pelo site ou pelo Live Server, não pelo duplo clique no arquivo."; });
    document.getElementById("pdf").onclick = () => window.print();
    document.getElementById("word").onclick = () => {
      const html = "<html><head><meta charset='utf-8'><title>Apostila</title></head><body>" + alvo.innerHTML + "</body></html>";
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob(["\ufeff", html], { type: "application/msword" }));
      a.download = "apostila-informatica.doc"; a.click();
    };
  </script>
</body>
</html>
